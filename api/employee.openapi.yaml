openapi: 3.0.0
servers:
  - description: Cluster Endpoint
    url: /api
info:
  description: Employee profiles of hospital staff for the Web-In-Cloud system
  version: "1.0.0"
  title: Employee Profiles API
tags:
  - name: employeeProfiles
    description: API for managing hospital employee profiles, qualifications, certificates, and archival status

paths:
  /employees:
    get:
      tags:
        - employeeProfiles
      summary: List employee profiles
      description: Returns all employee profiles, optionally filtered by department, specialization, or status.
      operationId: listEmployeeProfiles
      parameters:
        - in: query
          name: department
          schema:
            type: string
        - in: query
          name: specialization
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          description: Array of employee profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeProfile"
    post:
      tags:
        - employeeProfiles
      summary: Create a new employee profile
      operationId: createEmployeeProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeProfile"
      responses:
        "201":
          description: Created employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "400":
          description: Invalid request body
        "409":
          description: Employee profile with this id already exists

  /employees/{employeeId}:
    get:
      tags:
        - employeeProfiles
      summary: Get a single employee profile by id
      operationId: getEmployeeProfile
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "200":
          description: The requested employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "404":
          description: Employee profile not found
    put:
      tags:
        - employeeProfiles
      summary: Update an existing employee profile
      operationId: updateEmployeeProfile
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeProfile"
      responses:
        "200":
          description: Updated employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "400":
          description: Invalid request body
        "404":
          description: Employee profile not found
    delete:
      tags:
        - employeeProfiles
      summary: Archive an employee profile
      operationId: archiveEmployeeProfile
      parameters:
        - $ref: "#/components/parameters/EmployeeId"
      responses:
        "204":
          description: Employee profile archived
        "404":
          description: Employee profile not found

components:
  parameters:
    EmployeeId:
      in: path
      name: employeeId
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    EmployeeStatus:
      type: string
      enum:
        - active
        - archived
    EmployeeProfile:
      type: object
      required:
        - firstName
        - lastName
        - birthDate
        - position
        - specialization
        - qualification
        - employmentStartDate
        - certificates
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        position:
          type: string
        department:
          type: string
        specialization:
          type: string
        qualification:
          type: string
        employmentStartDate:
          type: string
          format: date
        certificates:
          type: array
          minItems: 1
          items:
            type: string
        note:
          type: string
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        archivedAt:
          type: string
          format: date-time
          readOnly: true
